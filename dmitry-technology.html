<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dmitry">
<meta name="theme-color" content="#05060f">
<title>Dmitry technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#05060f;--glass:rgba(20,20,26,.56);--glass-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--ink:#f2f1ee;--dim:#8f8e97;--gold:#a6f3e2;--gold-2:#6fd9c2;--err:#e0826a;--sans:'Manrope',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;height:100vh;height:100dvh;display:flex}
.side{width:232px;flex:none;display:flex;flex-direction:column;overflow-y:auto;padding:26px 18px 18px;background:linear-gradient(180deg,rgba(10,10,14,.84),rgba(8,8,11,.72));border-right:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{height:44px;display:flex;align-items:center;padding-left:10px;margin-bottom:22px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--dim);font-size:14px;text-align:left}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:var(--line)}
.sidecard{margin-top:auto;padding:14px 15px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}
.sidecard small{display:block;font-size:12px;color:var(--dim)}
.sidecard b{display:block;font-weight:500;margin:2px 0 8px;font-size:14px}
.bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .6s}
.sidecard small + small{margin-top:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:flex-end;align-items:center;padding:18px 26px 0}
.pill{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px}
.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.av{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 36%,#f4f1ea 0 17%,#2a2a31 18% 58%,#0b0b0e 60%)}
.home{flex:1;min-height:0;display:flex;flex-direction:column;padding:7vh 40px 22px;max-width:760px;width:100%}
.home h1{margin:0;font-weight:300;font-size:clamp(36px,5vw,60px);line-height:1.08;letter-spacing:-.025em}
.home p{margin:16px 0 28px;color:var(--dim);font-size:clamp(16px,1.6vw,19px);font-weight:300}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:15px 22px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:15px}
.cta svg{width:18px;height:18px}
.cta:hover{border-color:rgba(255,255,255,.22)}
.stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:22px 24px;min-height:128px;border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.stat span{font-size:13.5px;color:var(--dim)}
.stat b{display:block;font-size:30px;font-weight:400;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--dim)}
.stat .bar{margin-bottom:8px}
.thread{flex:1;min-height:0;overflow-y:auto;padding:12px 40px 12px;max-width:820px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg{margin:0 0 18px}
.who{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:6px}
.who .via{color:var(--gold)}
.who button{margin-left:auto;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim);font-size:11px;padding:2px 9px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .who{justify-content:flex-end}
.body{overflow-wrap:anywhere;word-wrap:break-word;max-width:100%}
.msg.user .body{max-width:80%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:rgba(255,255,255,.09);border:1px solid var(--line);white-space:pre-wrap}
.msg.assistant .body{padding:13px 16px;border-radius:20px 20px 20px 6px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.msg.err .body{border-color:rgba(224,130,106,.5);color:var(--err)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;justify-content:flex-end}
.imgs img{width:min(220px,62vw);aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--line);background:var(--glass-2);cursor:zoom-in}
.msg.assistant .imgs{justify-content:flex-start}
.body p{margin:0 0 8px}
.body p:last-child{margin-bottom:0}
.body h3,.body h4{margin:12px 0 6px;font-size:15px;font-weight:600}
.body ul,.body ol{margin:4px 0 8px;padding-left:20px}
.body li{margin:2px 0}
.body code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.body pre{position:relative;margin:10px 0;padding:12px 14px;background:#040405;border:1px solid var(--line);border-radius:14px;overflow-x:auto;font-size:12.5px;line-height:1.5;-webkit-overflow-scrolling:touch}
.body pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.body pre .cp{position:sticky;float:right;top:0;margin:-4px -4px 0 8px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim);font-size:11px}
.body a{color:var(--gold)}
.cursor{display:inline-block;width:7px;height:14px;margin-left:3px;vertical-align:-2px;background:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dock{padding:8px 40px calc(22px + env(safe-area-inset-bottom,0px));max-width:820px;width:100%;margin:0 auto}
.pend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px 8px}
.pi{position:relative;width:64px;height:64px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--glass-2)}
.pi img{width:100%;height:100%;object-fit:cover}
.pi .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:1}
.comp{display:flex;align-items:flex-end;gap:6px;padding:7px 7px 7px 7px;border:1px solid var(--line);border-radius:28px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#inp{flex:1;min-width:0;max-height:160px;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;line-height:1.4;padding:10px 6px;outline:none}
#inp::placeholder{color:var(--dim)}
.ibtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;display:grid;place-items:center}
.send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.send.stop{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hint{margin-top:8px;font-size:11.5px;color:var(--dim);text-align:center}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;max-height:88dvh;overflow-y:auto;background:#101015;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.pn h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-size:17px;font-weight:500}
.pn h2 button{border:0;background:none;color:var(--dim);font-size:24px;line-height:1;padding:0 4px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px 4px;font-size:13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim)}
.tabs button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.fld input[type=text],.fld input[type=password],.fld textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:16px;padding:11px 13px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:rgba(233,207,166,.6)}
.fld textarea{min-height:80px;resize:vertical}
.fld .s{margin-top:6px;font-size:12px;color:var(--dim)}
.fld .s a{color:var(--gold)}
.fld .check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.fld .check input{margin-top:4px;accent-color:var(--gold)}
.btn{padding:10px 17px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:13px}
.btn.fill{background:var(--ink);color:#111;border-color:var(--ink)}
.btn.dng{color:var(--err);border-color:rgba(224,130,106,.45)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{margin-top:8px;font-size:12.5px;color:var(--dim)}
.note.ok{color:var(--gold)}
.mlist{display:none;margin-top:8px;max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);-webkit-overflow-scrolling:touch}
.mlist.on{display:block}
.mlist button{display:block;width:100%;text-align:left;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.mlist button:last-child{border-bottom:0}
.mlist button.sel{background:var(--glass-2);color:var(--gold)}
.list{display:grid;gap:8px;margin-bottom:14px}
.hi{display:flex;gap:8px;align-items:stretch}
.hi .t{flex:1;min-width:0;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.hi .t.on{border-color:rgba(233,207,166,.6)}
.hi .x{flex:none;width:40px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--glass-2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.tile button{position:absolute;left:6px;bottom:6px;padding:3px 9px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px}
.empty-note{color:var(--dim);font-size:14px;padding:18px 4px}
.light{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:16px}
.light.on{display:flex}
.light img{max-width:100%;max-height:100%;border-radius:12px}
@media (max-width:820px){
  .shell{flex-direction:column}
  .side{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;width:auto;padding:6px;border:1px solid var(--line);border-radius:24px;z-index:5;background:rgba(12,12,16,.86)}
  .brand,.sidecard{display:none}
  .nav{flex-direction:row;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav button{min-width:72px}
  .nav button{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;line-height:1.2;white-space:nowrap;border-radius:16px;min-width:64px;justify-content:center;text-align:center}
  .nav button svg{width:18px;height:18px}
  .top{padding:14px 16px 0}
  .home{padding:4vh 20px 96px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:14px;min-height:0}
  .stat b{font-size:22px;margin:4px 0 6px}
  .stat small{font-size:11px}
  .thread{padding:10px 16px 14px}
  .dock{padding:6px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  .imgs img{width:min(170px,50vw)}
}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="shell">
  <aside class="side">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 1 13.8 10.2 23 12 13.8 13.8 12 23 10.2 13.8 1 12 10.2 10.2Z" fill="#f2f1ee"/></svg>
    </div>
    <nav class="nav" aria-label="Разделы">
      <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></button>
      <button data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Моя личность</span></button>
      <button data-go="world"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span>Мой мир</span></button>
      <button data-go="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Исследовать</span></button>
      <button data-go="community"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5M15 15c2.6-.4 4.6.9 5.5 3.5"/></svg><span>Сообщество</span></button>
      <button data-go="companion"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 3v4M9 12.5h.01M15 12.5h.01M9.5 15.5h5"/></svg><span>AI-компаньон</span></button>
      <button data-go="rating"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8"/></svg><span>Рейтинг</span></button>
      <button data-go="premium"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.7 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg><span>Premium</span></button>
      <button data-go="chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Чаты</span></button>
      <button data-go="photos"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-8 8"/></svg><span>Фото</span></button>
      <button data-go="memory"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.8l3 1.8"/></svg><span>Память</span></button>
      <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg><span>Настройки</span></button>
    </nav>
    <div class="sidecard">
      <small>Модель</small>
      <b id="sideModel">авто</b>
      <div class="bar"><i id="sideBar"></i></div>
      <small id="sideKey">ключ не добавлен</small>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="top">
      <button class="pill" data-go="settings"><span class="av" aria-hidden="true"></span><span>GUEST</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </header>

    <section id="home" class="home">
      <h1>Создай свою<br>цифровую вселенную</h1>
      <p>Исследуй. Общайся. Развивайся.</p>
      <button class="cta" id="cta"><svg viewBox="0 0 24 24" fill="#f2f1ee"><path d="M12 2 13.6 10.4 22 12 13.6 13.6 12 22 10.4 13.6 2 12 10.4 10.4Z"/></svg>Начать путешествие</button>
      <div class="stats">
        <div class="stat"><span>Уровень</span><b id="stLevel">1</b><div class="bar"><i id="stXp"></i></div><small id="stXpTxt">XP 0 / 100</small></div>
        <div class="stat"><span>NX Coins</span><b id="stCoins">0</b><small>монеты появятся позже</small></div>
        <div class="stat"><span>Онлайн</span><b id="stOnline">1</b><small>вы на этом устройстве</small></div>
      </div>
    </section>

    <section id="thread" class="thread" aria-live="polite" hidden></section>

    <footer class="dock">
      <div class="pend" id="pend" hidden></div>
      <div class="comp">
        <button class="ibtn" id="attach" aria-label="Прикрепить фото"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.3 20.2a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg></button>
        <textarea id="inp" rows="1" placeholder="Напишите сообщение…" enterkeyhint="send"></textarea>
        <button class="send" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="hint" id="hint"></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </footer>
  </main>
</div>

<div class="sheet" id="shChats"><div class="bk" data-close></div><div class="pn"><h2><span>Чаты</span><button data-close aria-label="Закрыть">×</button></h2><div class="list" id="chatList"></div><div class="acts"><button class="btn fill" data-new>Новый чат</button></div></div></div>
<div class="sheet" id="shPhotos"><div class="bk" data-close></div><div class="pn"><h2><span>Фото</span><button data-close aria-label="Закрыть">×</button></h2><div class="grid" id="photoGrid"></div><div class="acts"><button class="btn" id="photoAdd">Добавить фото</button></div></div></div>
<div class="sheet" id="shMemory"><div class="bk" data-close></div><div class="pn"><h2><span>Память</span><button data-close aria-label="Закрыть">×</button></h2>
  <div class="fld"><label class="check"><input type="checkbox" id="fMemory"><span>Учитывать предыдущие сообщения чата. Модель помнит контекст разговора.</span></label></div>
  <div class="fld"><div class="s" id="memStats"></div><div class="s">Чаты, фото и настройки хранятся только в этом браузере на этом устройстве.</div></div>
  <div class="acts"><button class="btn dng" id="memWipe">Очистить всю память</button></div>
  <div class="note" id="memNote"></div>
</div></div>
<div class="sheet" id="shSet"><div class="bk" data-close></div><div class="pn"><h2><span>Настройки</span><button data-close aria-label="Закрыть">×</button></h2>
  <div class="tabs" id="tabs"></div>
  <div class="fld"><label for="fKey">API-ключ</label><input id="fKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="вставьте ключ"><div class="s" id="fKeyHelp"></div></div>
  <div class="fld"><label for="fModel">Модель (можно оставить пустой)</label><input id="fModel" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="выберется сама">
    <div class="acts" style="margin-top:8px"><button class="btn" id="bTest">Проверить подключение</button><button class="btn" id="bList">Список моделей</button></div>
    <div class="mlist" id="mList"></div><div class="note" id="listNote"></div></div>
  <div class="fld"><label for="fSys">Системная инструкция</label><textarea id="fSys"></textarea></div>
  <div class="acts"><button class="btn fill" id="bSave">Сохранить</button></div>
  <div class="note" id="saveNote"></div>
</div></div>
<div class="light" id="light"><img alt=""></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function fmtN(n) { return Number(n).toLocaleString('ru-RU'); }

  /* ---------- storage: text in localStorage, photos in IndexedDB ---------- */
  var mem = {};
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] == null ? null : mem[k]; } }
  function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
  function loadJSON(k, d) { try { var v = JSON.parse(lsGet(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }

  var PROV = ['gemini', 'openrouter', 'groq'];
  var PNAME = { gemini: 'Google Gemini', openrouter: 'OpenRouter', groq: 'Groq' };
  var PHELP = {
    gemini: 'Бесплатный ключ: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>',
    openrouter: 'Бесплатный ключ: <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>',
    groq: 'Бесплатный ключ: <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>'
  };
  var DEFAULT_SYS = 'Ты полезный и точный ассистент. Отвечай на языке пользователя, по делу и понятно. Если не уверен, так и скажи.';
  var S = loadJSON('nm_settings', null) || {};
  S.provider = S.provider || 'gemini';
  S.keys = S.keys || {}; S.models = S.models || {};
  PROV.forEach(function (p) { if (S.keys[p] == null) S.keys[p] = ''; if (S.models[p] == null) S.models[p] = ''; });
  if (S.system == null) S.system = DEFAULT_SYS;
  if (S.memory == null) S.memory = true;

  var chats = loadJSON('nm_chats', []) || [];
  var curId = lsGet('nm_cur') || null;
  var photos = loadJSON('nm_photos', []) || [];
  var pending = [];
  var busy = false, stopFlag = false, VISION_OR = {};

  function saveAll() {
    lsSet('nm_settings', JSON.stringify(S));
    lsSet('nm_chats', JSON.stringify(chats.slice(0, 300)));
    lsSet('nm_photos', JSON.stringify(photos));
    lsSet('nm_cur', curId || '');
  }

  /* IndexedDB for image files (falls back to memory if unavailable) */
  var DB = null, memBlobs = {}, urls = {};
  function openDB() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open('dmitry-technology', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('blobs'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function putBlob(id, b) {
    memBlobs[id] = b;
    if (!DB) return Promise.resolve();
    return new Promise(function (res) {
      try { var t = DB.transaction('blobs', 'readwrite'); t.objectStore('blobs').put(b, id); t.oncomplete = res; t.onerror = res; t.onabort = res; }
      catch (e) { res(); }
    });
  }
  function getBlob(id) {
    if (memBlobs[id]) return Promise.resolve(memBlobs[id]);
    if (!DB) return Promise.resolve(null);
    return new Promise(function (res) {
      try { var q = DB.transaction('blobs').objectStore('blobs').get(id); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  }
  function delBlob(id) {
    delete memBlobs[id];
    if (urls[id]) { try { URL.revokeObjectURL(urls[id]); } catch (e) {} delete urls[id]; }
    if (!DB) return;
    try { DB.transaction('blobs', 'readwrite').objectStore('blobs').delete(id); } catch (e) {}
  }
  function clearBlobs() {
    Object.keys(urls).forEach(function (k) { try { URL.revokeObjectURL(urls[k]); } catch (e) {} });
    urls = {}; memBlobs = {};
    if (DB) { try { DB.transaction('blobs', 'readwrite').objectStore('blobs').clear(); } catch (e) {} }
  }
  function urlFor(id) {
    if (urls[id]) return Promise.resolve(urls[id]);
    return getBlob(id).then(function (b) {
      if (!b) return null;
      urls[id] = URL.createObjectURL(b);
      return urls[id];
    });
  }
  function dataUrlOf(id) {
    return getBlob(id).then(function (b) {
      if (!b) return null;
      return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = function () { res(null); }; fr.readAsDataURL(b); });
    });
  }
  function shrink(file) {
    var src = URL.createObjectURL(file);
    return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = src; })
      .then(function (img) {
        var k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return new Promise(function (res) { c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.86); });
      })
      .catch(function () { return file; })
      .then(function (b) { try { URL.revokeObjectURL(src); } catch (e) {} return b; });
  }
  function addFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || ''); });
    if (!list.length) return;
    var chain = Promise.resolve();
    list.forEach(function (f) {
      chain = chain.then(function () {
        return shrink(f).then(function (blob) {
          var id = uid();
          return putBlob(id, blob).then(function () {
            pending.push({ id: id });
            photos.unshift({ id: id, name: f.name || 'фото', ts: Date.now() });
          });
        });
      });
    });
    chain.then(function () { saveAll(); renderPending(); updateStats(); });
  }
  function removePending(id) {
    pending = pending.filter(function (p) { return p.id !== id; });
    photos = photos.filter(function (p) { return p.id !== id; });
    delBlob(id); saveAll(); renderPending(); updateStats();
  }
  function renderPending() {
    var box = $('pend'); box.innerHTML = '';
    pending.forEach(function (p) {
      var d = el('div', 'pi'), im = new Image(); im.alt = '';
      var x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Убрать фото');
      x.addEventListener('click', function () { removePending(p.id); });
      d.appendChild(im); d.appendChild(x); box.appendChild(d);
      urlFor(p.id).then(function (u) { if (u) im.src = u; });
    });
    box.hidden = !pending.length;
  }

  /* ---------- chats ---------- */
  function curChat() { for (var i = 0; i < chats.length; i++) if (chats[i].id === curId) return chats[i]; return null; }
  function newChat() { var c = { id: uid(), title: 'Новый чат', msgs: [], ts: Date.now() }; chats.unshift(c); curId = c.id; saveAll(); return c; }
  if (!curChat()) { if (chats.length) curId = chats[0].id; else newChat(); }

  /* ---------- markdown (escaped) ---------- */
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function block(txt) {
    var lines = txt.split('\n'), out = [], i = 0, para = [];
    function flush() { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } }
    while (i < lines.length) {
      var ln = lines[i], m;
      if ((m = /^(#{1,4})\s+(.*)$/.exec(ln))) { flush(); out.push('<h3>' + inline(m[2]) + '</h3>'); i++; }
      else if (/^\s*[-*]\s+/.test(ln)) { flush(); var li = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { li.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; } out.push('<ul>' + li.join('') + '</ul>'); }
      else if (/^\s*\d+[.)]\s+/.test(ln)) { flush(); var lo = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { lo.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++; } out.push('<ol>' + lo.join('') + '</ol>'); }
      else if (ln.trim() === '') { flush(); i++; }
      else { para.push(inline(ln)); i++; }
    }
    flush();
    return out.join('');
  }
  function md(text) {
    var parts = text.split('```'), out = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) out += block(parts[i]);
      else {
        var code = parts[i], nl = code.indexOf('\n');
        if (nl >= 0 && /^[\w+#.-]*$/.test(code.slice(0, nl).trim())) code = code.slice(nl + 1);
        out += '<pre><button class="cp" data-cp>копировать</button><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>';
      }
    }
    return out;
  }

  /* ---------- rendering ---------- */
  var thread = $('thread'), inp = $('inp'), sendBtn = $('send');
  var ICON_SEND = '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></svg>';

  function hydrate(root) {
    root.querySelectorAll('img[data-id]').forEach(function (im) {
      urlFor(im.dataset.id).then(function (u) { if (u) im.src = u; else { im.alt = 'фото удалено'; im.style.opacity = '.4'; } });
    });
  }
  function bubble(m, i) {
    var d = el('div', 'msg ' + m.role + (m.err ? ' err' : '')); d.dataset.i = i;
    var who = el('div', 'who');
    who.innerHTML = '<span>' + (m.role === 'user' ? 'Вы' : 'Dmitry') + '</span>' + (m.via ? '<span class="via">' + esc(m.via) + '</span>' : '') + (m.role === 'assistant' && !m.err ? '<button data-cpm>копировать</button>' : '');
    var b = el('div', 'body');
    if (m.imgs && m.imgs.length) {
      var w = el('div', 'imgs');
      m.imgs.forEach(function (id) { var im = new Image(); im.dataset.id = id; im.alt = 'фото'; w.appendChild(im); });
      b.appendChild(w);
    }
    if (m.role === 'user') { if (m.content) { var t = el('div'); t.textContent = m.content; b.appendChild(t); } }
    else b.insertAdjacentHTML('beforeend', md(m.content || ''));
    d.appendChild(who); d.appendChild(b);
    return d;
  }
  function renderAll() {
    var c = curChat(), has = !!(c && c.msgs.length);
    $('home').hidden = has;
    thread.hidden = !has;
    if (has) {
      thread.innerHTML = '';
      c.msgs.forEach(function (m, i) { thread.appendChild(bubble(m, i)); });
      hydrate(thread);
      thread.scrollTop = thread.scrollHeight;
    }
    updateStats();
  }
  function totalMsgs() { return chats.reduce(function (n, c) { return n + c.msgs.length; }, 0); }
  function updateStats() {
    var userMsgs = 0;
    chats.forEach(function (c) { c.msgs.forEach(function (m) { if (m.role === 'user') userMsgs++; }); });
    var lvl = 1 + Math.floor(userMsgs / 10), xp = userMsgs % 10;
    $('stLevel').textContent = fmtN(lvl);
    $('stXp').style.width = (xp * 10) + '%';
    $('stXpTxt').textContent = 'XP ' + (xp * 10) + ' / 100';
    $('stCoins').textContent = fmtN(userMsgs * 10);
    $('stOnline').textContent = '1';
    var p = S.provider, m = S.models[p];
    $('sideModel').textContent = m ? m : 'авто';
    var n = PROV.filter(function (x) { return S.keys[x]; }).length;
    $('sideKey').textContent = n ? 'подключено сервисов: ' + n : 'ключ не добавлен';
    $('sideBar').style.width = Math.min(100, n * 34) + '%';
    $('hint').textContent = n ? 'Фото сохраняются на этом устройстве' : 'Добавьте ключ в Настройках, чтобы начать';
  }
  function setBusy(v) {
    busy = v; sendBtn.className = 'send' + (v ? ' stop' : '');
    sendBtn.innerHTML = v ? ICON_STOP : ICON_SEND;
    sendBtn.setAttribute('aria-label', v ? 'Остановить' : 'Отправить');
  }
  function autoGrow() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; }
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });

  function copyText(t, btn, label) {
    function done() { if (btn) { btn.textContent = 'готово'; setTimeout(function () { btn.textContent = label; }, 1100); } }
    function fb() { var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done(); }
    try { navigator.clipboard.writeText(t).then(done, fb); } catch (e) { fb(); }
  }
  thread.addEventListener('click', function (e) {
    var t = e.target;
    if (t.tagName === 'IMG' && t.src) { openLight(t.src); return; }
    if (t.hasAttribute && t.hasAttribute('data-cp')) copyText(t.parentNode.querySelector('code').textContent, t, 'копировать');
    else if (t.hasAttribute && t.hasAttribute('data-cpm')) { var i = +t.closest('.msg').dataset.i, c = curChat(); if (c && c.msgs[i]) copyText(c.msgs[i].content, t, 'копировать'); }
  });
  function openLight(src) { var L = $('light'); L.querySelector('img').src = src; L.classList.add('on'); }
  $('light').addEventListener('click', function () { this.classList.remove('on'); });

  /* ---------- providers ---------- */
  function HttpErr(status, msg) { var e = new Error(msg); e.status = status; return e; }
  function readErr(res) {
    return res.text().catch(function () { return ''; }).then(function (t) {
      var msg = t;
      try { var j = JSON.parse(t); msg = (j.error && (j.error.message || j.error)) || j.message || t; if (typeof msg !== 'string') msg = JSON.stringify(msg); } catch (e) {}
      return HttpErr(res.status, String(msg || 'ошибка').slice(0, 300));
    });
  }
  var OAI = { openrouter: 'https://openrouter.ai/api/v1', groq: 'https://api.groq.com/openai/v1' };

  function fetchNames(p, key) {
    if (p === 'openrouter') {
      return fetch('https://openrouter.ai/api/v1/models').then(function (r) { if (!r.ok) throw r; return r.json(); }, function () { throw new Error('network'); })
        .catch(function (r) { if (r && r.status !== undefined) return readErr(r).then(function (e) { throw e; }); throw r; })
        .then(function (j) {
          var free = (j.data || []).filter(function (m) { return m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0; });
          free.forEach(function (m) { var mods = (m.architecture && m.architecture.input_modalities) || []; VISION_OR[m.id] = mods.indexOf('image') >= 0; });
          free.sort(function (a, b) { return (b.context_length || 0) - (a.context_length || 0); });
          return free.map(function (m) { return m.id; });
        });
    }
    if (!key) return Promise.reject(HttpErr(401, 'нет ключа'));
    if (p === 'gemini') {
      return fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key)).then(function (r) {
        if (!r.ok) return readErr(r).then(function (e) { throw e; });
        return r.json();
      }).then(function (j) {
        return (j.models || []).filter(function (m) { return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; }).map(function (m) { return m.name.replace(/^models\//, ''); });
      });
    }
    return fetch(OAI.groq + '/models', { headers: { 'Authorization': 'Bearer ' + key } }).then(function (r) {
      if (!r.ok) return readErr(r).then(function (e) { throw e; });
      return r.json();
    }).then(function (j) { return (j.data || []).map(function (m) { return m.id; }); });
  }
  function rank(p, names) {
    var bad = /whisper|guard|tts|embed|image|audio|live|imagen|veo|aqa|moderation|orpheus|playai|safeguard|transcri|robotics|computer-use|learnlm|nano|distil/i;
    var ok = names.filter(function (n) { return !bad.test(n); });
    function ver(n) { if (/latest/.test(n)) return 999; var m = n.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; }
    function uniq(a) { var s = {}, o = []; a.forEach(function (x) { if (!s[x]) { s[x] = 1; o.push(x); } }); return o; }
    if (p === 'gemini') {
      var A = ok.filter(function (n) { return /flash/.test(n) && !/lite/.test(n) && !/exp|preview/.test(n); }).sort(function (a, b) { return ver(b) - ver(a); });
      var B = ok.filter(function (n) { return /flash/.test(n); }).sort(function (a, b) { return ver(b) - ver(a); });
      return uniq(A.concat(B, ok));
    }
    if (p === 'groq') {
      var pref = [/gpt-oss-120b/, /llama-3\.3-70b/, /llama.*70b/, /qwen.*32b/, /gpt-oss-20b/, /llama.*(8b|scout|maverick)/], out = [];
      pref.forEach(function (re) { ok.forEach(function (n) { if (re.test(n)) out.push(n); }); });
      return uniq(out.concat(ok));
    }
    var good = /llama|qwen|gemini|deepseek|gpt-oss|mistral|glm|kimi/i;
    return uniq(ok.filter(function (n) { return good.test(n); }).concat(ok));
  }
  function isModelErr(e) {
    var m = e.message || '';
    return e.status === 404 || (e.status === 400 && /model/i.test(m)) || /decommission|model_not_found|does not exist|not supported|limit:\s*0/i.test(m);
  }
  function retriable(e) { return e.name === 'TypeError' || e.status === 429 || e.status >= 500; }
  function friendly(p, e) {
    var s = e.status, m = e.message || '';
    if (e.name === 'TypeError') return 'Запрос не дошёл до ' + PNAME[p] + '. Если чат открыт внутри приложения (Claude, Telegram и т.п.), откройте ссылку в Safari.';
    if (s === 401 || s === 403) return 'Ключ не принят сервисом ' + PNAME[p] + '. Проверьте его в настройках. (' + m.slice(0, 120) + ')';
    if (s === 429) return 'Лимит ' + PNAME[p] + ' на сейчас исчерпан. Подождите немного или добавьте второй сервис в настройках.';
    if (s === 404) return 'Модель не найдена в ' + PNAME[p] + '. Она подберётся сама при следующей попытке.';
    return PNAME[p] + ': ' + m;
  }
  function sse(res) {
    return (async function* () {
      if (!res.body || typeof res.body.getReader !== 'function') {
        var all = await res.text();
        var ls = all.split('\n');
        for (var k = 0; k < ls.length; k++) { var ln = ls[k].replace(/\r$/, ''); if (ln.indexOf('data:') === 0) { var dd = ln.slice(5).trim(); if (dd) yield dd; } }
        return;
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      try {
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          buf += dec.decode(r.value, { stream: true });
          var i;
          while ((i = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, i).replace(/\r$/, ''); buf = buf.slice(i + 1);
            if (line.indexOf('data:') === 0) { var d = line.slice(5).trim(); if (d) yield d; }
          }
        }
        var rest = buf.trim();
        if (rest.indexOf('data:') === 0) yield rest.slice(5).trim();
      } finally { try { reader.cancel(); } catch (e) {} }
    })();
  }
  function splitDataUrl(d) { var i = d.indexOf(','); return { mime: d.slice(5, d.indexOf(';')), data: d.slice(i + 1), url: d }; }

  async function* stream(p, history, model) {
    var key = S.keys[p], res;
    if (p === 'gemini') {
      var contents = [];
      for (var i = 0; i < history.length; i++) {
        var m = history[i], parts = [];
        if (m.imgs && m.imgs.length) {
          for (var q = 0; q < m.imgs.length; q++) {
            var du = await dataUrlOf(m.imgs[q]);
            if (du) { var sp = splitDataUrl(du); parts.push({ inlineData: { mimeType: sp.mime, data: sp.data } }); }
          }
        }
        parts.push({ text: m.content || (m.imgs && m.imgs.length ? 'Опиши, что на фото.' : '…') });
        contents.push({ role: m.role === 'assistant' ? 'model' : 'user', parts: parts });
      }
      var body = { contents: contents };

      var R = l.r * 4;
      var gr = sx.createRadialGradient(l.x, l.y, 0, l.x, l.y, R);
      gr.addColorStop(0, rgba(l.c, l.a * 0.5)); gr.addColorStop(1, rgba(l.c, 0));
      sx.fillStyle = gr; sx.fillRect(l.x - R, l.y - R, R * 2, R * 2);
      sx.save(); sx.translate(l.x, l.y); sx.rotate(l.rot); sx.fillStyle = rgba(l.c, l.a);
      sx.beginPath(); sx.ellipse(0, 0, l.r, l.r * 0.45, 0, 0, 6.283); sx.fill(); sx.restore();
    });
  }
  function stepScene(dt) {
    petals.forEach(function (l, i) {
      l.x += (l.vx + Math.sin(tt * 0.9 + l.ph) * 8) * dt;
      l.y += l.vy * dt; l.rot += l.vr * dt;
      if (l.y > SH * 0.84 || l.x < -30) petals[i] = makePetal(false);
    });
  }
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now; tt += dt;
    stepScene(dt); paintScene();
    requestAnimationFrame(frame);
  }
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resizeScene, 120); });

  /* ---------- start ---------- */
  resizeScene();
  if (!reduce) { last = performance.now(); requestAnimationFrame(frame); }
  setBusy(false);
  renderPending();
  renderAll();
  openDB().then(function (db) { DB = db; });
  saveAll();
})();
</script>
</body>
</html>
